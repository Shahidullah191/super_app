name: super_app
description: "Multi-Service Super App – E-commerce, Grocery, Pharmacy, Food, Ride, Courier & On-Demand Services."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ── Localization ──────────────────────────────────────────────────────────────
  flutter_localizations:
    sdk: flutter

  # ── State Management & Routing ──────────────────────────────────────────────
  get: ^4.7.3

  # ── Network ─────────────────────────────────────────────────────────────────
  dio: ^5.9.2
  shared_preferences: ^2.5.4

  # ── Maps & Location ──────────────────────────────────────────────────────────
  google_maps_flutter: ^2.15.0
  geolocator: ^14.0.2

  # ── Images ───────────────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  image_picker: ^1.2.1

  # ── Firebase / Notifications ─────────────────────────────────────────────────
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  #flutter_local_notifications: ^21.0.0

  # ── UI Utilities ─────────────────────────────────────────────────────────────
  flutter_svg: ^2.2.4
  shimmer: ^3.0.0
  lottie: ^3.3.2
  pin_code_fields: ^9.1.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
